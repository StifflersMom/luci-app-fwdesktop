name: release

# Push a tag like v1.0.0-r9 (= PKG_VERSION-rPKG_RELEASE) to build the apk
# with the official OpenWrt SDK, publish it as a GitHub release and update
# the signed apk package feed on GitHub Pages.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      feed: ${{ steps.feed.outputs.feed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the package version
        run: |
          v=$(sed -n 's/^PKG_VERSION:=//p' luci-app-fwdesktop/Makefile)
          r=$(sed -n 's/^PKG_RELEASE:=//p' luci-app-fwdesktop/Makefile)
          test "${GITHUB_REF_NAME}" = "v$v-r$r" || { echo "tag ${GITHUB_REF_NAME} != v$v-r$r"; exit 1; }

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk gettext libncurses-dev python3 python3-setuptools rsync unzip zstd file wget

      - name: Unit tests
        run: |
          node tests/model.test.js
          node tests/import.test.js
          node tests/ipset.test.js
          node tests/schema.test.js

      - name: Build apk with the OpenWrt SDK
        id: build
        run: |
          apk=$(./scripts/build-apk.sh "$RUNNER_TEMP/sdk" | tail -n1)
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          ls -l "$apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.apk }}
          generate_release_notes: true
          body: |
            Install on OpenWrt 25.12 from the package feed (see README), or directly:

                apk add --allow-untrusted luci-app-fwdesktop-*.apk

            Then open Network → Firewall Desktop.

      # The feed is signed with the private key in the APK_FEED_KEY secret.
      # Without the secret the release still works, only the feed is skipped.
      - name: Build signed package feed
        id: feed
        env:
          APK_FEED_KEY: ${{ secrets.APK_FEED_KEY }}
        run: |
          if [ -z "$APK_FEED_KEY" ]; then
            echo "APK_FEED_KEY secret not set, skipping the package feed"
            echo "feed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apktool=$(ls "$RUNNER_TEMP"/sdk/openwrt-sdk-*/staging_dir/host/bin/apk | head -n1)
          keydir="$RUNNER_TEMP/feedkey"
          mkdir -m 700 "$keydir"
          printf '%s\n' "$APK_FEED_KEY" > "$keydir/fwdesktop-feed.pem"
          mkdir -p site
          cp "${{ steps.build.outputs.apk }}" site/
          cp feed/fwdesktop-feed.pem site/fwdesktop-feed.pem
          cp feed/index.html site/index.html
          ( cd site && "$apktool" mkndx --allow-untrusted --keys-dir "$keydir" \
              --sign "$keydir/fwdesktop-feed.pem" --output packages.adb *.apk )
          rm -rf "$keydir"
          ls -l site
          echo "feed=yes" >> "$GITHUB_OUTPUT"

      - name: Upload feed for GitHub Pages
        if: steps.feed.outputs.feed == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    if: needs.build.outputs.feed == 'yes'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy package feed to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
